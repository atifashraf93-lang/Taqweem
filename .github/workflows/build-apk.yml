name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html updater.js core.js data.js hadith.js naat.js duas.js books.js remote.js qdata.js app.js seerat-data.js seerat-detail.js seerat-detail-a1.js seerat-detail-a2.js seerat-detail-s1.js seerat-detail-s2.js seerat-detail-h1.js umrah-data.js umrah.js banners.js daily.js extras.js seerat.js extras.css sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png azan.mp3 quran-ar.txt www/
          cp -r audio www/audio
          cp -r img www/img
          if [ -d naat ]; then cp -r naat www/naat; fi
          if [ -f translation-ur.txt ]; then cp translation-ur.txt www/; fi

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Native update plugin and activity
        run: |
          D=android/app/src/main/java/pk/smaa/taqweem
          mkdir -p $D
          cp java/*.java $D/
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Fixed signing key and version number (so new APKs update the old app)
        run: |
          mkdir -p ~/.android
          cp smaa.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"2.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv('GITHUB_WORKSPACE') + '/smaa.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE

      - name: Permissions (location, notifications, vibration)
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -c "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml

      - name: Adhan notification sound
        run: |
          mkdir -p android/app/src/main/res/raw
          cp azan_notify.mp3 android/app/src/main/res/raw/azan_notify.mp3

      - name: App icons
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp www/icon-192.png $RES/mipmap-$d/$n.png
            done
          done

      - name: Stamp build number
        run: echo "window.SMAA_BUILD = ${{ github.run_number }};" > www/build.js

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taqweem-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK and pack the web files (self-update bundle)
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Taqweem.apk
          cd android/app/src/main/assets/public && zip -qr "$GITHUB_WORKSPACE/www.zip" . && cd "$GITHUB_WORKSPACE" && ls -l www.zip

      - name: Second download address for the web bundle (ota branch)
        id: ota
        continue-on-error: true
        run: |
          mkdir -p /tmp/ota && cp www.zip /tmp/ota/ && cd /tmp/ota
          git init -q && git checkout -q -b ota
          git config user.name "SMAA CI" && git config user.email "ci@users.noreply.github.com"
          git add www.zip && git commit -q -m "web bundle ${{ github.run_number }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q -f origin ota
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Taqweem APK ${{ github.run_number }}
          body: "need=1 sha=${{ steps.ota.outputs.sha }}"
          files: |
            Taqweem.apk
            www.zip
